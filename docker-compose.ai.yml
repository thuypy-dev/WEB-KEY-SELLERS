version: '3.8'

services:
  # Microservice Chatbot AI (FastAPI + RAG + ChromaDB)
  key-ai:
    build:
      context: ./AI_SYSTEM
      dockerfile: Dockerfile
    container_name: key_ai
    restart: always
    ports:
      - "${AI_PORT:-8008}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=mysql+aiomysql://root:RootPassword123@key_mysql:3306/vtv_key_sellers
      - REDIS_HOST=key_redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6I4bH7upyPaOPZJtsZ1sE7NVFAap_FEczb0fDdX7ckOjA}
      - RESET_CHROMA_DB=False
      - CHROMA_DB_PATH=/app/chroma_db_data
      - DEBUG=False
    volumes:
      - ai_chroma_data:/app/chroma_db_data

volumes:
  ai_chroma_data:
