server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy trực tiếp sang NestJS backend
    # Giúp frontend gọi API cùng origin/cùng port 3003, chạy được trên mọi máy/mọi IP mà không lo CORS hay sai IP
    location ~ ^/(auth|chat|products|categories|orders|admin|users|payment|stats|keys|interactions|search|reviews) {
        proxy_pass http://key_backend:611;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bật nén Gzip tăng tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
