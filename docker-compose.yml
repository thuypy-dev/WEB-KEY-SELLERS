version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL
  key-mysql:
    image: mysql:8.0
    container_name: key_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123
      MYSQL_DATABASE: vtv_key_sellers
    ports:
      - "3306:3306"
    volumes:
      - mysql_key_data_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Stack (Hỗ trợ Semantic Cache & RedisSearch)
  key-redis:
    image: redis/redis-stack:latest
    container_name: key_redis
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - redis_key_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Microservice Chatbot AI (FastAPI + RAG + ChromaDB)
  key-ai:
    build:
      context: ./AI_SYSTEM
      dockerfile: Dockerfile
    container_name: key_ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+aiomysql://root:RootPassword123@key_mysql:3306/vtv_key_sellers
      - REDIS_HOST=key_redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESET_CHROMA_DB=False
      - CHROMA_DB_PATH=/app/chroma_db_data
      - DEBUG=False
    volumes:
      - ai_chroma_data:/app/chroma_db_data
    depends_on:
      key-mysql:
        condition: service_healthy
      key-redis:
        condition: service_healthy

  # 4. Backend NestJS
  key-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: key_backend
    restart: always
    ports:
      - "611:611"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql://root:RootPassword123@key_mysql:3306/vtv_key_sellers
      - AI_SERVICE_URL=http://key_ai:8000/api/v1/ask
    depends_on:
      key-mysql:
        condition: service_healthy
      key-redis:
        condition: service_healthy
      key-ai:
        condition: service_started

  # 5. Frontend React Vite
  key-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://192.168.1.14:611
    container_name: key_frontend
    restart: always
    ports:
      - "3003:80"
    depends_on:
      - key-backend

volumes:
  mysql_key_data_v2:
  redis_key_data:
  ai_chroma_data:
