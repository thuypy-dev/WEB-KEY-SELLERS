version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL
  key-mysql:
    image: mysql:8.0
    container_name: key_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123@
      MYSQL_DATABASE: vtv_key_sellers
    ports:
      - "3306:3306"
    volumes:
      - mysql_key_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Stack
  key-redis:
    image: redis/redis-stack:latest
    container_name: key_redis
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - redis_key_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend NestJS
  key-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: key_backend
    restart: always
    ports:
      - "611:611"
    env_file:
      - .env
    depends_on:
      key-mysql:
        condition: service_healthy
      key-redis:
        condition: service_healthy

  # 4. Frontend React Vite
  key-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://192.168.1.14:611
    container_name: key_frontend
    restart: always
    ports:
      - "3003:80"
    depends_on:
      - key-backend

volumes:
  mysql_key_data:
  redis_key_data:
