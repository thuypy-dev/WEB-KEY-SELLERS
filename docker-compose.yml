version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL
  key-mysql:
    image: mysql:8.0
    container_name: key_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123@
      MYSQL_DATABASE: vtv_key_sellers
    ports:
      - "3306:3306"
    volumes:
      - mysql_key_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Stack
  key-redis:
    image: redis/redis-stack:latest
    container_name: key_redis
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - redis_key_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend NestJS
  key-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: key_backend
    restart: always
    ports:
      - "611:611"
    environment:
      - PORT=611
      - DATABASE_URL=mysql://root:RootPassword123@key_mysql:3306/vtv_key_sellers
      - FRONTEND_URL=http://192.168.1.14:3003,http://localhost:3003
      # JWT Secrets
      - JWT_ACCESS_SECRET=49b34de75bf279b443b6f2806deff6f0f0f66f955705b69aa9146cc8df820428
      - JWT_ACCESS_EXPIRE=1h
      - JWT_REFRESH_SECRET=0ffa1b06b3d3a4abb6293827fed3b92494709febe2245e59e4923b3264e1fbe5
      - JWT_REFRESH_EXPIRE=7d
      # Mã hóa kho key bản quyền
      - ENCRYPTION_KEY=fe07652f6f3aaee4cd28bec43c3ef994ff84e60fbb79ea81967b98bee4aea47f
      - ENCRYPTION_IV_LENGTH=16
      # Tài khoản mặc định
      - EMAIL_ADMIN=admin@pdtkey.com
      - PASSWORD_ADMIN=Admin@123456
      - EMAIL_STAFF=staff@pdtkey.com
      - PASSWORD_STAFF=Staff@123456
      - EMAIL_SUPPORT=support@pdtkey.com
      - PASSWORD_SUPPORT=Staff@123456
      # Cloudinary
      - CLOUDINARY_CLOUD_NAME=Root0611
      - CLOUDINARY_API_KEY=491852915335598
      - CLOUDINARY_API_SECRET=bh2aN9NRICMSA1bs0YgnSrBk8-I
    depends_on:
      key-mysql:
        condition: service_healthy
      key-redis:
        condition: service_healthy

  # 4. Frontend React Vite
  key-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://192.168.1.14:611
    container_name: key_frontend
    restart: always
    ports:
      - "3003:80"
    depends_on:
      - key-backend

volumes:
  mysql_key_data:
  redis_key_data:
