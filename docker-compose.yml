version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL
  key-mysql:
    image: mysql:8.0
    container_name: key_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassword123}
      MYSQL_DATABASE: vtv_key_sellers
    ports:
      - "3306:3306"
    volumes:
      - mysql_key_data_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Stack (Hỗ trợ Semantic Cache & RedisSearch)
  key-redis:
    image: redis/redis-stack:latest
    container_name: key_redis
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning
    volumes:
      - redis_key_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Backend NestJS
  key-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: key_backend
    restart: always
    ports:
      - "611:611"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=0611
      - DATABASE_URL=mysql://root:RootPassword123@key_mysql:3306/vtv_key_sellers
      - AI_SERVICE_URL=http://key_ai:8000/api/v1/ask
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-default_jwt_secret_pdtkey_access_token_123456}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-default_jwt_secret_pdtkey_refresh_token_123456}
      - ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION:-15m}
      - REFRESH_TOKEN_EXPIRATION=${REFRESH_TOKEN_EXPIRATION:-7d}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-pdtkey_default_encryption_key_32chars!}
      - ENCRYPTION_IV_LENGTH=${ENCRYPTION_IV_LENGTH:-16}
      - EMAIL_ADMIN=${EMAIL_ADMIN:-admin@pdtkey.com}
      - PASSWORD_ADMIN=${PASSWORD_ADMIN:-Admin@123456}
      - EMAIL_STAFF=${EMAIL_STAFF:-staff@pdtkey.com}
      - PASSWORD_STAFF=${PASSWORD_STAFF:-Staff@123456}
      - FRONTEND_URL=${FRONTEND_URL:-https://pdtkey-sellers.store,https://www.pdtkey-sellers.store,http://192.168.1.14:3003,http://localhost:3003,http://localhost:5173}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-"PDTKEY Security <no-reply@pdtkey.com>"}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      key-mysql:
        condition: service_healthy
      key-redis:
        condition: service_healthy

  # 4. Frontend React Vite
  key-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: key_frontend
    restart: always
    ports:
      - "3003:80"
    depends_on:
      - key-backend

volumes:
  mysql_key_data_v2:
  redis_key_data:
